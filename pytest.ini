[pytest]
pythonpath = .
testpaths = tests
# The default run must stay offline and fast: model-dependent tests carry the
# `slow` marker and are excluded here. Run them with: pytest -m slow
addopts = -m "not slow"
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    slow: marks tests as slow or requiring model weights (run with '-m slow')
